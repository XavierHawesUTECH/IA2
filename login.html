<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <title>Coding Conf Registration</title>
    <style>
        .error-message {
            color: #ff6b6b;
            margin-top: 5px;
            display: none;
        }

        .error-message,
        .file-info small {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <div class="logo-container">
            <img src="https://uploads.onecompiler.io/454dn93ez/457chmas4/logo-mark.svg" alt="Logo">
            <h1>Coding Conf</h1>
        </div>
        <h2>Your Journey to Coding Conf 2026 Starts Here!</h2>
        <form id="registrationForm">
            <label>Upload Avatar</label>
            <div class="file-drop-zone" onclick="document.getElementById('avatar').click()">
                <img src="https://uploads.onecompiler.io/454dn93ez/457chmas4/icon-upload.svg" alt="Upload">
                <p>Drag and drop or click to upload</p>
                <input type="file" id="avatar" hidden required>
                <div id="fileError" class="error-message">File size too large. Please upload a file under 500KB.</div>
            </div>
            <div class="file-info">
                <img src="https://uploads.onecompiler.io/454dn93ez/457chmas4/icon-info.svg" alt="Info">
                <small>Upload your photo (JPG or PNG, max size: 500KB).</small>
            </div>
            
            <label>Full Name</label>
            <input type="text" id="fullName" required>

            <label>Email Address</label>
            <input type="email" id="email" required>
            <div id="emailError" class="error-message">Please enter a valid email address.</div>

            <label>GitHub Username</label>
            <input type="text" id="github" required>

            <button type="submit">Generate My Ticket</button>
        </form>
    </main>
    <script src="js/validation.js"></script>
</body>
</html>
