<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Coding Conf - Home</title>
    <style>
        
        body.home {
            flex-direction: column;
            justify-content: center;
            gap: 2.5rem;
            text-align: center;
        }

        body.home header,
        body.home footer {
            position: relative;
            z-index: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.home .logo-container {
            margin-bottom: 0;
        }

        body.home .logo-container h1 {
            font-size: 2rem;
            margin: 0;
        }

        body.home main {
            gap: 2rem;
        }

        body.home nav a {
            display: inline-block;
            padding: 15px 30px;
            background: var(--orange-500);
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
            border-radius: 8px;
            transition: filter 0.2s ease;
        }

        body.home nav a:hover {
            filter: brightness(1.1);
        }

        body.home nav a:focus-visible {
            outline: 2px solid #ffffff80;
            outline-offset: 3px;
        }

        body.home section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body.home h2 {
            font-size: 2rem;
            margin: 0 0 1rem;
        }

        body.home p {
            margin: 0.4rem 0;
            font-size: 1.1rem;
        }

        body.home footer p {
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body class="home">
    <header>
        <div class="logo-container">
            <img src="https://uploads.onecompiler.io/454dn93ez/457chmas4/logo-mark.svg" alt="Logo">
            <h1>Coding Conf 2026</h1>
        </div>
    </header>
    <main>
        <section>
            <h2>Event Details</h2>
            <p>Date: October 26, 2026</p>
            <p>Location: Papine, Kingston</p>
            <p>Join us for an exciting day of coding and networking!</p>
        </section>
        <nav>
            <a href="login.html">Register Now</a>
        </nav>
    </main>
    <footer>
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>
</body>
</html>
